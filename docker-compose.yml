services:
  mongo:
    image: mongo:7
    container_name: mentecart-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: mentecart
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./mentecart-backend
      dockerfile: Dockerfile
    container_name: mentecart-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ./mentecart-backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/mentecart
    ports:
      - "5000:5000"

volumes:
  mongo_data:
